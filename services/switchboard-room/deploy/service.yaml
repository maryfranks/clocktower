apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: switchboard-room
  labels:
    cloud.googleapis.com/location: ${GCP_REGION}
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "false"
    spec:
      serviceAccountName: ${GCP_RUNTIME_SA}
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - name: switchboard-room
          image: ${SWITCHBOARD_IMAGE}
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
          env:
            - name: ENV
              value: prod
            - name: CHIME_REGULATOR_MODE
              value: http
            - name: CHIME_REGULATOR_URL
              value: ${CHIME_REGULATOR_URL}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: https://collector.littlefuzzydinos.com/v1/traces
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 6
  traffic:
    - percent: 100
      latestRevision: true
