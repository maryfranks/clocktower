name: Deploy - switchboard-room

on:
  push:
    branches:
      - main
    paths:
      - "services/switchboard-room/**"
      - ".github/workflows/deploy-switchboard-room.yaml"

permissions:
  contents: read
  id-token: write

env:
  SERVICE_NAME: switchboard-room
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  AR_REPOSITORY: ${{ vars.AR_REPOSITORY }}
  GCP_RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          working-directory: services/switchboard-room

      - name: Install dependencies and verify code
        working-directory: services/switchboard-room
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push container image
        id: build
        working-directory: services/switchboard-room
        run: |
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/${SERVICE_NAME}:${GITHUB_SHA}"
          docker build -f deploy/Dockerfile -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"
          echo "image_uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"

      - name: Render and deploy Cloud Run service
        working-directory: services/switchboard-room
        env:
          SWITCHBOARD_IMAGE: ${{ steps.build.outputs.image_uri }}
        run: |
          envsubst '${GCP_REGION} ${GCP_RUNTIME_SA} ${SWITCHBOARD_IMAGE}' < deploy/service.yaml > /tmp/service.rendered.yaml
          gcloud run services replace /tmp/service.rendered.yaml \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}"

      - name: Allow public unauthenticated ingress
        run: |
          gcloud run services add-iam-policy-binding "${SERVICE_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --member="allUsers" \
            --role="roles/run.invoker"

      - name: Verify live endpoints
        run: |
          SERVICE_URL=$(gcloud run services describe "${SERVICE_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format="value(status.url)")
          echo "Deployed URL: ${SERVICE_URL}"
          curl --fail --silent --show-error "${SERVICE_URL}/healthz"
          curl --fail --silent --show-error -X POST "${SERVICE_URL}/api/session" \
            -H "Content-Type: application/json" \
            -d '{}'
